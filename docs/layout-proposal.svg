<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .panel { fill: #111827; stroke: #1f2937; }
      .header-bad-marketing { fill: #1e293b; stroke: #334155; }
      .header-bad-app { fill: #161b2a; stroke: #2a3142; }
      .header-good { fill: #0D9488; stroke: #0f766e; }
      .rail { fill: #06080f; stroke: #1f2937; }
      .rail-good { fill: #0b0f1a; stroke: #0D9488; stroke-dasharray: 4 3; }
      .content { fill: #1b2030; stroke: #2a3142; }
      .toast-bad { fill: #1b2030; stroke: #e5484d; stroke-width: 1.5; }
      .toast-good { fill: #1b2030; stroke: #16A34A; stroke-width: 1.5; }
      .banner-bad { fill: rgba(244,63,94,0.18); stroke: #e5484d; }
      .banner-good { fill: rgba(13,148,136,0.18); stroke: #0D9488; }
      .label { fill: #F1F5F9; font-size: 13px; font-weight: 600; }
      .label-sm { fill: #94A3B8; font-size: 11px; }
      .title { fill: #F1F5F9; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
      .h-bad { fill: #e5484d; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .h-good { fill: #16A34A; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .annotation { fill: #cbd5e1; font-size: 11px; }
      .arrow { stroke: #e5484d; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .arrow-good { stroke: #16A34A; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
      .scroll-ind { fill: #94A3B8; font-size: 10px; font-style: italic; }
      .viewport { fill: none; stroke: #64748B; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .scroll-pos { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 3 3; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1600" height="900" class="bg"/>

  <!-- TITLE -->
  <text x="800" y="40" text-anchor="middle" class="title">Wobblio App Shell — Layout Proposal</text>
  <text x="800" y="60" text-anchor="middle" class="label-sm">Left: current (two headers, toast anchored to body) · Right: proposed (single sticky topbar, portaled toast)</text>

  <!-- ============ LEFT: BEFORE ============ -->
  <text x="380" y="100" text-anchor="middle" class="h-bad">Before — what ships today</text>

  <!-- viewport frame -->
  <rect x="40" y="115" width="680" height="720" rx="8" class="viewport"/>
  <text x="50" y="132" class="label-sm">viewport (sticky surfaces shown pinned)</text>

  <!-- SiteHeader (sticky, marketing chrome) -->
  <rect x="40" y="140" width="680" height="56" class="header-bad-marketing"/>
  <text x="56" y="173" class="label">SiteHeader (sticky · 80px)</text>
  <text x="540" y="173" class="label-sm">marketing chrome · z:100</text>

  <!-- App TopBar (NOT sticky, scrolls away) -->
  <rect x="40" y="196" width="680" height="48" class="header-bad-app"/>
  <text x="56" y="225" class="label">TopBar (NOT sticky · scrolls away)</text>
  <text x="540" y="225" class="label-sm">quota · avatar · search</text>

  <!-- RLS banner (scrolls away) -->
  <rect x="60" y="256" width="640" height="36" rx="6" class="banner-bad"/>
  <text x="76" y="280" class="label">RLS warning banner</text>
  <text x="540" y="280" class="label-sm">scrolls off-screen</text>

  <!-- LeftNav (not sticky) -->
  <rect x="40" y="304" width="72" height="500" class="rail"/>
  <text x="76" y="328" text-anchor="middle" class="label-sm">Left</text>
  <text x="76" y="342" text-anchor="middle" class="label-sm">Nav</text>
  <text x="76" y="356" text-anchor="middle" class="label-sm">(not</text>
  <text x="76" y="370" text-anchor="middle" class="label-sm">sticky)</text>

  <!-- Inner shell card (framed box) -->
  <rect x="124" y="304" width="580" height="500" rx="14" class="content" stroke-dasharray="3 3"/>
  <text x="140" y="328" class="label-sm">.app-shell (framed card · min-height: 760px)</text>

  <!-- pane content -->
  <rect x="148" y="348" width="540" height="32" rx="4" fill="#1b2030"/>
  <text x="164" y="370" class="label">Pane title — slides under SiteHeader on scroll</text>

  <rect x="148" y="400" width="260" height="140" rx="6" fill="#1f2937"/>
  <rect x="424" y="400" width="260" height="140" rx="6" fill="#1f2937"/>
  <rect x="148" y="556" width="540" height="220" rx="6" fill="#1f2937"/>

  <!-- toast (absolute inside .app-body, scrolls with body) -->
  <rect x="540" y="248" width="160" height="36" rx="8" class="toast-bad"/>
  <text x="552" y="271" class="label">Toast (absolute@88px)</text>

  <!-- scroll position indicator -->
  <line x1="730" y1="140" x2="730" y2="244" class="scroll-pos"/>
  <text x="738" y="195" class="scroll-ind">~140px of chrome</text>
  <text x="738" y="208" class="scroll-ind">before content</text>

  <!-- annotations -->
  <path d="M 420 280 Q 470 296 540 266" class="arrow"/>
  <text x="430" y="320" class="annotation">Toast disappears under</text>
  <text x="430" y="334" class="annotation">SiteHeader on any scroll</text>

  <path d="M 60 256 Q 30 240 30 215" class="arrow"/>
  <text x="46" y="700" class="annotation" transform="rotate(-90 46 700)">RLS banner scrolls away — security state lost</text>

  <!-- ============ RIGHT: AFTER ============ -->
  <text x="1220" y="100" text-anchor="middle" class="h-good">After — single shell, sticky chrome</text>

  <rect x="880" y="115" width="680" height="720" rx="8" class="viewport"/>
  <text x="890" y="132" class="label-sm">viewport</text>

  <!-- Single TopBar (sticky, replaces both headers) -->
  <rect x="880" y="140" width="680" height="56" class="header-good" opacity="0.25"/>
  <rect x="880" y="140" width="680" height="56" fill="none" stroke="#0D9488" stroke-width="2"/>
  <text x="896" y="173" class="label">TopBar (sticky · 64px · only header)</text>
  <text x="1380" y="173" class="label-sm">brand · search · quota · avatar</text>

  <!-- RLS banner (sticky under topbar) -->
  <rect x="880" y="196" width="680" height="32" class="banner-good"/>
  <text x="896" y="217" class="label">RLS warning (sticky · top: var(--chrome-top))</text>

  <!-- LeftNav (sticky) -->
  <rect x="880" y="228" width="72" height="576" class="rail-good"/>
  <text x="916" y="252" text-anchor="middle" class="label-sm">Left</text>
  <text x="916" y="266" text-anchor="middle" class="label-sm">Nav</text>
  <text x="916" y="282" text-anchor="middle" class="label-sm">sticky</text>
  <text x="916" y="296" text-anchor="middle" class="label-sm">✓</text>

  <!-- flush content area (no framed card) -->
  <rect x="964" y="248" width="580" height="32" rx="4" fill="#1b2030"/>
  <text x="980" y="270" class="label">Pane title (scroll-margin-top set ✓)</text>

  <rect x="964" y="296" width="280" height="140" rx="8" fill="#161b2a" stroke="#2a3142"/>
  <rect x="1260" y="296" width="284" height="140" rx="8" fill="#161b2a" stroke="#2a3142"/>
  <rect x="964" y="452" width="580" height="340" rx="8" fill="#161b2a" stroke="#2a3142"/>

  <!-- toast (portaled, fixed) -->
  <rect x="1380" y="208" width="170" height="36" rx="8" class="toast-good"/>
  <text x="1392" y="231" class="label">Toast (portal · fixed)</text>

  <!-- annotations -->
  <path d="M 1330 226 Q 1360 226 1380 226" class="arrow-good"/>
  <text x="1180" y="262" class="annotation" text-anchor="end">Toast stays visible at any scroll position</text>

  <path d="M 952 280 Q 935 280 920 280" class="arrow-good"/>
  <text x="960" y="824" class="annotation">LeftNav + RLS banner persist · no nested scroll · single chrome layer</text>

  <!-- LEGEND -->
  <rect x="40" y="855" width="14" height="14" class="header-bad-marketing"/>
  <text x="62" y="867" class="label-sm">extraneous marketing chrome</text>

  <rect x="240" y="855" width="14" height="14" fill="none" stroke="#e5484d" stroke-width="1.5"/>
  <text x="262" y="867" class="label-sm">scrolls under header (bug)</text>

  <rect x="460" y="855" width="14" height="14" class="header-good"/>
  <text x="482" y="867" class="label-sm">single sticky header (fix)</text>

  <rect x="660" y="855" width="14" height="14" fill="none" stroke="#16A34A" stroke-width="1.5"/>
  <text x="682" y="867" class="label-sm">portaled / sticky · stays visible</text>

  <line x1="880" y1="862" x2="910" y2="862" class="scroll-pos"/>
  <text x="918" y="867" class="label-sm">scroll-locked chrome height</text>
</svg>
