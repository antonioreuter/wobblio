<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .header { fill: #0b0f1a; stroke: #0D9488; stroke-width: 2; }
      .rail { fill: #06080f; stroke: #0D9488; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .banner { fill: rgba(244,63,94,0.18); stroke: #e5484d; stroke-width: 1; }
      .panel { fill: #161b2a; stroke: #2a3142; }
      .toast { fill: #1b2030; stroke: #16A34A; stroke-width: 1.5; }
      .label { fill: #F1F5F9; font-size: 13px; font-weight: 600; }
      .label-sm { fill: #94A3B8; font-size: 11px; }
      .label-brand { fill: #F1F5F9; font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
      .label-brand-accent { fill: #0D9488; font-size: 16px; font-weight: 800; }
      .title { fill: #F1F5F9; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
      .subtitle { fill: #94A3B8; font-size: 12px; }
      .h-section { fill: #0D9488; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      .annotation { fill: #cbd5e1; font-size: 11px; }
      .arrow { stroke: #0D9488; stroke-width: 1.5; fill: none; marker-end: url(#arrow-good); }
      .viewport { fill: none; stroke: #64748B; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .pin { fill: #0D9488; }
      .badge { fill: #0D9488; }
      .badge-text { fill: #ffffff; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .gate-badge { fill: #f59e0b; }
      .gate-text { fill: #0B0F19; font-size: 9px; font-weight: 700; }
    </style>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="1100" height="900" class="bg"/>

  <!-- TITLE -->
  <text x="550" y="44" text-anchor="middle" class="title">Wobblio App Shell — Current Implementation</text>
  <text x="550" y="66" text-anchor="middle" class="subtitle">After refactor · single sticky topbar · sticky left rail · portaled toast · sandbox env-gated</text>

  <!-- viewport frame -->
  <rect x="60" y="100" width="980" height="720" rx="10" class="viewport"/>
  <text x="72" y="118" class="label-sm">browser viewport</text>

  <!-- ============ STICKY TOPBAR (64px) ============ -->
  <rect x="60" y="125" width="980" height="56" class="header"/>
  <!-- brand -->
  <text x="84" y="160" class="label-brand">Wobblio<tspan class="label-brand-accent">.</tspan></text>
  <text x="200" y="160" class="label">Dashboard</text>
  <!-- right side -->
  <rect x="700" y="138" width="150" height="30" rx="14" fill="#1b2030" stroke="#2a3142"/>
  <text x="775" y="157" text-anchor="middle" class="label-sm">9 / 15 receipts</text>
  <circle cx="880" cy="153" r="14" fill="#0D9488"/>
  <text x="880" y="157" text-anchor="middle" class="badge-text">AR</text>
  <rect x="912" y="138" width="30" height="30" rx="8" fill="none" stroke="#2a3142"/>
  <text x="927" y="158" text-anchor="middle" class="label-sm">↩</text>
  <!-- sticky badge -->
  <rect x="985" y="135" width="48" height="16" rx="3" class="badge"/>
  <text x="1009" y="146" text-anchor="middle" class="badge-text">sticky</text>
  <text x="985" y="172" text-anchor="end" class="label-sm">z: var(--z-header)</text>

  <!-- ============ RLS BANNER (sticky under topbar, env-gated) ============ -->
  <rect x="60" y="181" width="980" height="34" class="banner"/>
  <text x="84" y="203" class="label" fill="#fecaca">⚠ PostgreSQL tenant separation bypass warning</text>
  <rect x="985" y="186" width="48" height="16" rx="3" class="gate-badge"/>
  <text x="1009" y="198" text-anchor="middle" class="gate-text">GATED</text>
  <text x="985" y="226" text-anchor="end" class="label-sm">NEXT_PUBLIC_SANDBOX_MODE=true only</text>

  <!-- ============ LEFT NAV (sticky, full-height) ============ -->
  <rect x="60" y="215" width="80" height="605" class="rail"/>
  <!-- nav icons -->
  <g>
    <rect x="76" y="240" width="48" height="40" rx="10" fill="#0D9488"/>
    <text x="100" y="265" text-anchor="middle" class="label-sm" fill="#fff">⌂</text>
    <rect x="76" y="290" width="48" height="40" rx="10" fill="none" stroke="#1f2937"/>
    <text x="100" y="315" text-anchor="middle" class="label-sm">📄</text>
    <rect x="76" y="340" width="48" height="40" rx="10" fill="none" stroke="#1f2937"/>
    <text x="100" y="365" text-anchor="middle" class="label-sm">📊</text>
    <rect x="76" y="390" width="48" height="40" rx="10" fill="none" stroke="#1f2937"/>
    <text x="100" y="415" text-anchor="middle" class="label-sm">🛒</text>
    <rect x="76" y="440" width="48" height="40" rx="10" fill="none" stroke="#1f2937"/>
    <text x="100" y="465" text-anchor="middle" class="label-sm">€</text>
    <rect x="76" y="490" width="48" height="40" rx="10" fill="none" stroke="#1f2937"/>
    <text x="100" y="515" text-anchor="middle" class="label-sm">⚙</text>
  </g>
  <text x="100" y="785" text-anchor="middle" class="label-sm">Left Nav</text>
  <text x="100" y="800" text-anchor="middle" class="h-section">sticky</text>

  <!-- ============ CONTENT (flush, no framed card) ============ -->
  <text x="160" y="245" class="h-section">Pane content · flush · no inner card</text>

  <text x="160" y="275" class="label" font-size="22" font-weight="800">Dashboard</text>
  <text x="160" y="297" class="label-sm">scroll-margin-top: calc(var(--chrome-top) + 16px)</text>

  <!-- stat cards -->
  <rect x="160" y="320" width="200" height="90" rx="10" class="panel"/>
  <text x="172" y="342" class="label-sm">MTD SPEND</text>
  <text x="172" y="372" class="label" font-size="22">€1,284.50</text>
  <text x="172" y="395" class="label-sm" fill="#16A34A">▼ 8% vs last month</text>

  <rect x="376" y="320" width="200" height="90" rx="10" class="panel"/>
  <text x="388" y="342" class="label-sm">BUDGET HEALTH</text>
  <text x="388" y="372" class="label" font-size="22">72%</text>
  <text x="388" y="395" class="label-sm">on track</text>

  <rect x="592" y="320" width="200" height="90" rx="10" class="panel"/>
  <text x="604" y="342" class="label-sm">SCANS LEFT</text>
  <text x="604" y="372" class="label" font-size="22">6 / 15</text>
  <text x="604" y="395" class="label-sm">resets Sunday</text>

  <rect x="808" y="320" width="180" height="90" rx="10" class="panel"/>
  <text x="820" y="342" class="label-sm">SAVED (YTD)</text>
  <text x="820" y="372" class="label" font-size="22">€312</text>
  <text x="820" y="395" class="label-sm" fill="#16A34A">Anti-Inflation Engine</text>

  <!-- chart + breakdown -->
  <rect x="160" y="430" width="540" height="200" rx="10" class="panel"/>
  <text x="180" y="455" class="label">Spend over time</text>
  <polyline points="180,610 240,580 300,560 360,530 420,540 480,500 540,480 600,470 660,440 680,420"
            stroke="#0D9488" stroke-width="2.5" fill="none"/>

  <rect x="716" y="430" width="272" height="200" rx="10" class="panel"/>
  <text x="736" y="455" class="label">By category</text>
  <rect x="736" y="475" width="80" height="14" rx="3" fill="#0D9488"/>
  <text x="822" y="487" class="label-sm">Groceries 42%</text>
  <rect x="736" y="498" width="56" height="14" rx="3" fill="#16A34A"/>
  <text x="798" y="510" class="label-sm">Dining 28%</text>
  <rect x="736" y="521" width="40" height="14" rx="3" fill="#7c3aed"/>
  <text x="782" y="533" class="label-sm">Transit 18%</text>
  <rect x="736" y="544" width="22" height="14" rx="3" fill="#f59e0b"/>
  <text x="764" y="556" class="label-sm">Other 12%</text>

  <!-- recent invoices -->
  <rect x="160" y="650" width="828" height="150" rx="10" class="panel"/>
  <text x="180" y="675" class="label">Recent invoices</text>
  <line x1="180" y1="688" x2="968" y2="688" stroke="#2a3142"/>
  <text x="180" y="710" class="label-sm">Jun 11 · Albert Heijn · Groceries · 14 items</text>
  <text x="950" y="710" text-anchor="end" class="label" font-variant-numeric="tabular-nums">€47.85</text>
  <text x="180" y="734" class="label-sm">Jun 10 · Praxis · Home &amp; Garden · 3 items</text>
  <text x="950" y="734" text-anchor="end" class="label" font-variant-numeric="tabular-nums">€124.00</text>
  <text x="180" y="758" class="label-sm">Jun 09 · Vapiano · Dining · 5 items</text>
  <text x="950" y="758" text-anchor="end" class="label" font-variant-numeric="tabular-nums">€38.50</text>
  <text x="180" y="782" class="label-sm">Jun 08 · NS Dutch Railways · Transit · 1 item</text>
  <text x="950" y="782" text-anchor="end" class="label" font-variant-numeric="tabular-nums">€8.40</text>

  <!-- ============ TOAST (portaled, position: fixed) ============ -->
  <rect x="820" y="231" width="200" height="42" rx="10" class="toast"/>
  <circle cx="840" cy="252" r="6" fill="#16A34A"/>
  <text x="856" y="256" class="label">Receipt scanned ✓</text>
  <text x="1020" y="225" text-anchor="end" class="label-sm">portal → document.body</text>
  <path d="M 920 273 L 920 290" class="arrow"/>
  <text x="920" y="305" text-anchor="middle" class="annotation">position: fixed · z: var(--z-toast) · 400</text>

  <!-- ============ LEGEND ============ -->
  <rect x="60" y="843" width="980" height="45" rx="6" fill="#111827" stroke="#1f2937"/>

  <rect x="76" y="855" width="40" height="18" rx="3" class="badge"/>
  <text x="96" y="868" text-anchor="middle" class="badge-text">sticky</text>
  <text x="122" y="868" class="label-sm">pinned in viewport on scroll</text>

  <rect x="320" y="855" width="40" height="18" rx="3" class="gate-badge"/>
  <text x="340" y="868" text-anchor="middle" class="gate-text">GATED</text>
  <text x="366" y="868" class="label-sm">dev-only · stripped from prod when env unset</text>

  <line x1="700" y1="864" x2="730" y2="864" stroke="#0D9488" stroke-width="2"/>
  <text x="738" y="868" class="label-sm">brand-emerald · z-index scale: rls 95 · header 100 · drawer 200 · modal 300 · toast 400</text>
</svg>
