document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

========= */\n:root {\n  /* ---- Raw palette ----------------------------------------------------- */\n  --indigo-500: #6366f1;   /* Electric Indigo — brand */\n  --indigo-600: #4f46e5;\n  --indigo-700: #3730a3;\n  --teal-600:   #0d9488;   /* Aurora Teal — success */\n  --amber-500:  #f59e0b;   /* Warm Amber — review/warn */\n  --amber-600:  #d97706;\n  --rose-500:   #f43f5e;   /* Sunset Coral — danger */\n  --rose-600:   #e11d48;\n\n  --space-950:  #05060b;   /* Deep Space — app background */\n  --space-900:  #090c15;\n  --ink-900:    #0f172a;   /* Deep Ink — light-mode text */\n  --slate-500:  #64748b;\n  --slate-400:  #94a3b8;   /* Slate Space — muted label */\n  --slate-300:  #cbd5e1;\n  --white-50:   #f8fafc;   /* Star White */\n  --solar-100:  #f1f5f9;   /* Solar light background */\n\n  /* ---- Merchant brand colors ------------------------------------------ */\n  --merchant-ah:        #00a1e2;\n  --merchant-jumbo:     #f59e0b;\n  --merchant-dirk:      #ef4444;\n  --merchant-lidl:      #8b5cf6;\n  --merchant-tokomania: #10b981;\n  --merchant-cantinho:  #be123c;\n\n  /* ---- Semantic surface tokens (DARK default) ------------------------- */\n  --bg-color:           #161a24;  /* lifted off pure black so the centered app's shadow reads */\n  --glass-bg:           rgba(13, 17, 30, 0.72);\n  --glass-border:       rgba(255, 255, 255, 0.07);\n  --glass-hover-border: rgba(99, 102, 241, 0.25);\n  --glass-highlight:    rgba(255, 255, 255, 0.02);\n  --nav-bg:             rgba(9, 12, 21, 0.85);\n\n  /* ---- Semantic text -------------------------------------------------- */\n  --text-primary:   #f8fafc;\n  --text-secondary: #94a3b8;\n  --text-muted:     #64748b;\n\n  /* ---- Semantic accents ----------------------------------------------- */\n  --brand:        #6366f1;\n  --brand-glow:   rgba(99, 102, 241, 0.25);\n  --brand-hover:  #4f46e5;\n\n  --success:      #0d9488;\n  --success-glow: rgba(13, 148, 136, 0.15);\n  --warning:      #f59e0b;\n  --warning-glow: rgba(245, 158, 11, 0.15);\n  --danger:       #f43f5e;\n  --danger-glow:  rgba(244, 63, 94, 0.15);\n}\n\n[data-theme=\"light\"] {\n  --bg-color:           #eaeef5;\n  --glass-bg:           rgba(255, 255, 255, 0.9);\n  --glass-border:       rgba(15, 23, 42, 0.1);\n  --glass-hover-border: rgba(99, 102, 241, 0.45);\n  --glass-highlight:    rgba(15, 23, 42, 0.025);\n  --nav-bg:             rgba(255, 255, 255, 0.85);\n\n  --text-primary:   #0f172a;\n  --text-secondary: #475569;\n  --text-muted:     #64748b;\n\n  --brand:        #4f46e5;\n  --brand-glow:   rgba(79, 70, 229, 0.12);\n  --brand-hover:  #3730a3;\n\n  --success:      #0d9488;\n  --success-glow: rgba(13, 148, 136, 0.1);\n  --warning:      #d97706;\n  --warning-glow: rgba(217, 119, 6, 0.1);\n  --danger:       #e11d48;\n  --danger-glow:  rgba(225, 29, 72, 0.1);\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Wobblio · Typography Tokens\n   Outfit = display (titles, metrics, totals). Inter = body / dense UI.\n   Financial figures always use tabular-nums.\n   ========================================================================== */\n:root {\n  --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Type scale (px) */\n  --text-2xs: 11px;   /* badge / overline */\n  --text-xs:  12px;   /* metadata */\n  --text-sm:  13.5px; /* dense table / labels */\n  --text-md:  14px;   /* body default */\n  --text-lg:  17px;   /* lead paragraph */\n  --text-xl:  20px;   /* card title */\n  --text-2xl: 24px;   /* pane title */\n  --text-3xl: 32px;   /* metric value */\n  --text-4xl: 42px;   /* section title */\n  --text-hero: clamp(38px, 5.5vw, 62px);\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold: 600;\n  --weight-bold:    700;\n  --weight-black:   800;\n\n  /* Line height + tracking */\n  --leading-tight: 1.1;\n  --leading-snug:  1.4;\n  --leading-body:  1.6;\n  --tracking-tight: -0.02em;\n  --tracking-hero:  -0.04em;\n  --tracking-wide:  0.05em;  /* uppercase overlines */\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Wobblio · Spacing, Radius & Layout Tokens\n   ========================================================================== */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* Corner radii */\n  --radius-sm:   6px;   /* tags, chips, small badges */\n  --radius-md:   8px;   /* inputs / list rows / merchant badge */\n  --radius-lg:   12px;  /* buttons, dropzones */\n  --radius-xl:   16px;  /* glass cards */\n  --radius-2xl:  20px;  /* app shell */\n  --radius-pill: 9999px;\n\n  /* Control sizing */\n  --control-height: 44px;     /* min touch target */\n  --control-height-sm: 34px;\n  --icon-button: 42px;\n\n  /* Layout widths */\n  --container-max: 1200px;\n  --container-wide: 1300px;\n  --app-max: 1560px;\n  --rail-width: 80px;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Wobblio · Effects — glass, shadow, blur, aurora gradients, motion\n   ========================================================================== */\n:root {\n  /* Elevation */\n  --card-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5),\n                 0 0 1px 1px rgba(255, 255, 255, 0.05) inset;\n  --shadow-brand-glow: 0 10px 30px -10px var(--brand-glow);\n  --shadow-drawer: -10px 0 40px rgba(0, 0, 0, 0.4);\n\n  /* Glass blur */\n  --blur-glass: blur(20px) saturate(160%); /* @kind other */\n  --blur-nav:   blur(16px); /* @kind other */\n  --blur-overlay: blur(8px); /* @kind other */\n\n  /* Aurora background blobs (dark) */\n  --blob-gradient-1: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-2: radial-gradient(circle, rgba(13, 148, 136, 0.12) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-3: radial-gradient(circle, rgba(244, 63, 94, 0.08) 0%, transparent 65%); /* @kind other */\n\n  /* Brand gradients */\n  --gradient-brand: linear-gradient(90deg, #6366f1 0%, #0d9488 100%); /* @kind other */\n  --gradient-avatar: linear-gradient(135deg, var(--brand) 0%, var(--brand-hover) 100%); /* @kind other */\n  --gradient-heading: linear-gradient(135deg, var(--text-primary) 30%, var(--brand) 100%); /* @kind other */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.25, 0.8, 0.25, 1); /* @kind other */\n  --transition-fast: 0.2s ease; /* @kind other */\n  --transition-glass: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s var(--ease-out); /* @kind other */\n}\n\n[data-theme=\"light\"] {\n  --card-shadow: 0 18px 40px -14px rgba(15, 23, 42, 0.16),\n                 0 0 0 1px rgba(15, 23, 42, 0.03) inset;\n  --blob-gradient-1: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-2: radial-gradient(circle, rgba(13, 148, 136, 0.16) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-3: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, transparent 65%); /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Wobblio · Base elements & core utility classes\n   Reusable primitives shared by specimen cards, UI kits and prototypes.\n   ========================================================================== */\n\n*, *::before, *::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  background-color: var(--bg-color);\n  color: var(--text-primary);\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out);\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\np { margin: 0; color: var(--text-secondary); }\n\na { color: var(--brand); text-decoration: none; }\n\n.tabular { font-variant-numeric: tabular-nums; }\n\n/* ---- Premium polish: selection, scrollbars, focus ---------------------- */\n::selection { background: var(--brand-glow); color: var(--text-primary); }\n* { scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent; }\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }\n::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: padding-box; }\n:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }\nbutton, a, input, select, [role=\"button\"] { -webkit-tap-highlight-color: transparent; }\n\n/* ---- Aurora background ------------------------------------------------- */\n.aurora-bg {\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  z-index: 0;\n  overflow: hidden;\n  background: var(--bg-color);\n  transition: background-color 0.4s var(--ease-out);\n}\n.aurora-bg .blob {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(120px);\n  opacity: 0.85;\n}\n.aurora-bg .blob-1 {\n  width: 650px; height: 650px;\n  background: var(--blob-gradient-1);\n  top: -200px; right: -100px;\n  animation: wobblioBlob 15s ease-in-out infinite alternate;\n}\n.aurora-bg .blob-2 {\n  width: 500px; height: 500px;\n  background: var(--blob-gradient-2);\n  bottom: 10%; left: -150px;\n  animation: wobblioBlob 18s ease-in-out infinite alternate-reverse;\n}\n.aurora-bg .blob-3 {\n  width: 700px; height: 400px;\n  background: var(--blob-gradient-3);\n  top: 45%; left: 45%;\n  transform: translate(-50%, -50%);\n  filter: blur(140px);\n}\n@keyframes wobblioBlob {\n  0%   { transform: translateY(0) scale(1); }\n  100% { transform: translateY(30px) scale(1.1); }\n}\n@media (prefers-reduced-motion: reduce) {\n  .aurora-bg .blob { animation: none; }\n}\n\n/* ---- Glass surface ----------------------------------------------------- */\n.glass {\n  background: var(--glass-bg);\n  border: 1px solid var(--glass-border);\n  backdrop-filter: var(--blur-glass);\n  -webkit-backdrop-filter: var(--blur-glass);\n  border-radius: var(--radius-xl);\n  box-shadow: var(--card-shadow);\n  transition: var(--transition-glass);\n}\n.glass:hover { border-color: var(--glass-hover-border); }\n.glass-interactive:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--card-shadow), var(--shadow-brand-glow);\n}\n\n/* ---- Badge / pill ------------------------------------------------------ */\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-body);\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  padding: 4px 10px;\n  border-radius: var(--radius-pill);\n  white-space: nowrap;\n}\n.badge--primary { background: var(--brand-glow);   color: var(--brand);   border: 1px solid rgba(99,102,241,0.2); }\n.badge--success { background: var(--success-glow); color: var(--success); border: 1px solid rgba(13,148,136,0.2); }\n.badge--warning { background: var(--warning-glow); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }\n.badge--danger  { background: var(--danger-glow);  color: var(--danger);  border: 1px solid rgba(244,63,94,0.2); }\n\n/* ---- Buttons ----------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  font-weight: var(--weight-semibold);\n  border-radius: var(--radius-lg);\n  padding: 11px 24px;\n  cursor: pointer;\n  transition: all var(--transition-fast);\n  border: 1px solid transparent;\n  outline: none;\n  text-decoration: none;\n}\n.btn--primary {\n  background: var(--brand);\n  color: #ffffff;\n  box-shadow: 0 4px 20px -2px var(--brand-glow);\n}\n.btn--primary:hover {\n  background: var(--brand-hover);\n  transform: translateY(-1px);\n  box-shadow: 0 6px 24px -1px var(--brand-glow);\n}\n.btn--outline {\n  background: transparent;\n  color: var(--text-primary);\n  border: 1px solid var(--glass-border);\n}\n.btn--outline:hover { background: var(--glass-highlight); border-color: var(--text-secondary); }\n.btn--text { background: transparent; color: var(--text-secondary); padding: 8px 16px; }\n.btn--text:hover { color: var(--text-primary); }\n.btn--lg { padding: 14px 28px; font-size: var(--text-lg); }\n.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }\n\n.btn-icon {\n  width: var(--icon-button);\n  height: var(--icon-button);\n  border-radius: 50%;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  transition: all var(--transition-fast);\n  border: 1px solid var(--glass-border);\n  background: var(--glass-bg);\n  color: var(--text-primary);\n}\n.btn-icon:hover { border-color: var(--brand); color: var(--brand); transform: scale(1.05); }\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Wobblio Design System — global entry point\n   Consumers link THIS file. It is an @import manifest only.\n   ========================================================================== */\n/* ==========================================================================\n   Wobblio · Webfonts\n   Type pairing: Outfit (display) + Inter (body). Loaded from Google Fonts.\n   NOTE: substitut   #0f172a;   /* Deep Ink — light-mode text */\n  --slate-500:  #64748b;\n  --slate-400:  #94a3b8;   /* Slate Space — muted label */\n  --slate-300:  #cbd5e1;\n  --white-50:   #f8fafc;   /* Star White */\n  --solar-100:  #f1f5f9;   /* Solar light background */\n\n  /* ---- Merchant brand colors ------------------------------------------ */\n  --merchant-ah:        #00a1e2;\n  --merchant-jumbo:     #f59e0b;\n  --merchant-dirk:      #ef4444;\n  --merchant-lidl:      #8b5cf6;\n  --merchant-tokomania: #10b981;\n  --merchant-cantinho:  #be123c;\n\n  /* ---- Semantic surface tokens (DARK default) ------------------------- */\n  --bg-color:           #161a24;  /* lifted off pure black so the centered app's shadow reads */\n  --glass-bg:           rgba(13, 17, 30, 0.72);\n  --glass-border:       rgba(255, 255, 255, 0.07);\n  --glass-hover-border: rgba(99, 102, 241, 0.25);\n  --glass-highlight:    rgba(255, 255, 255, 0.02);\n  --nav-bg:             rgba(9, 12, 21, 0.85);\n\n  /* ---- Semantic text -------------------------------------------------- */\n  --text-primary:   #f8fafc;\n  --text-secondary: #94a3b8;\n  --text-muted:     #64748b;\n\n  /* ---- Semantic accents ----------------------------------------------- */\n  --brand:        #6366f1;\n  --brand-glow:   rgba(99, 102, 241, 0.25);\n  --brand-hover:  #4f46e5;\n\n  --success:      #0d9488;\n  --success-glow: rgba(13, 148, 136, 0.15);\n  --warning:      #f59e0b;\n  --warning-glow: rgba(245, 158, 11, 0.15);\n  --danger:       #f43f5e;\n  --danger-glow:  rgba(244, 63, 94, 0.15);\n}\n\n[data-theme=\"light\"] {\n  --bg-color:           #eaeef5;\n  --glass-bg:           rgba(255, 255, 255, 0.9);\n  --glass-border:       rgba(15, 23, 42, 0.1);\n  --glass-hover-border: rgba(99, 102, 241, 0.45);\n  --glass-highlight:    rgba(15, 23, 42, 0.025);\n  --nav-bg:             rgba(255, 255, 255, 0.85);\n\n  --text-primary:   #0f172a;\n  --text-secondary: #475569;\n  --text-muted:     #64748b;\n\n  --brand:        #4f46e5;\n  --brand-glow:   rgba(79, 70, 229, 0.12);\n  --brand-hover:  #3730a3;\n\n  --success:      #0d9488;\n  --success-glow: rgba(13, 148, 136, 0.1);\n  --warning:      #d97706;\n  --warning-glow: rgba(217, 119, 6, 0.1);\n  --danger:       #e11d48;\n  --danger-glow:  rgba(225, 29, 72, 0.1);\n}\n\n/* ==========================================================================\n   Wobblio · Typography Tokens\n   Outfit = display (titles, metrics, totals). Inter = body / dense UI.\n   Financial figures always use tabular-nums.\n   ========================================================================== */\n:root {\n  --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Type scale (px) */\n  --text-2xs: 11px;   /* badge / overline */\n  --text-xs:  12px;   /* metadata */\n  --text-sm:  13.5px; /* dense table / labels */\n  --text-md:  14px;   /* body default */\n  --text-lg:  17px;   /* lead paragraph */\n  --text-xl:  20px;   /* card title */\n  --text-2xl: 24px;   /* pane title */\n  --text-3xl: 32px;   /* metric value */\n  --text-4xl: 42px;   /* section title */\n  --text-hero: clamp(38px, 5.5vw, 62px);\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold: 600;\n  --weight-bold:    700;\n  --weight-black:   800;\n\n  /* Line height + tracking */\n  --leading-tight: 1.1;\n  --leading-snug:  1.4;\n  --leading-body:  1.6;\n  --tracking-tight: -0.02em;\n  --tracking-hero:  -0.04em;\n  --tracking-wide:  0.05em;  /* uppercase overlines */\n}\n\n/* ==========================================================================\n   Wobblio · Spacing, Radius & Layout Tokens\n   ========================================================================== */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* Corner radii */\n  --radius-sm:   6px;   /* tags, chips, small badges */\n  --radius-md:   8px;   /* inputs / list rows / merchant badge */\n  --radius-lg:   12px;  /* buttons, dropzones */\n  --radius-xl:   16px;  /* glass cards */\n  --radius-2xl:  20px;  /* app shell */\n  --radius-pill: 9999px;\n\n  /* Control sizing */\n  --control-height: 44px;     /* min touch target */\n  --control-height-sm: 34px;\n  --icon-button: 42px;\n\n  /* Layout widths */\n  --container-max: 1200px;\n  --container-wide: 1300px;\n  --app-max: 1560px;\n  --rail-width: 80px;\n}\n\n/* ==========================================================================\n   Wobblio · Effects — glass, shadow, blur, aurora gradients, motion\n   ========================================================================== */\n:root {\n  /* Elevation */\n  --card-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5),\n                 0 0 1px 1px rgba(255, 255, 255, 0.05) inset;\n  --shadow-brand-glow: 0 10px 30px -10px var(--brand-glow);\n  --shadow-drawer: -10px 0 40px rgba(0, 0, 0, 0.4);\n\n  /* Glass blur */\n  --blur-glass: blur(20px) saturate(160%); /* @kind other */\n  --blur-nav:   blur(16px); /* @kind other */\n  --blur-overlay: blur(8px); /* @kind other */\n\n  /* Aurora background blobs (dark) */\n  --blob-gradient-1: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-2: radial-gradient(circle, rgba(13, 148, 136, 0.12) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-3: radial-gradient(circle, rgba(244, 63, 94, 0.08) 0%, transparent 65%); /* @kind other */\n\n  /* Brand gradients */\n  --gradient-brand: linear-gradient(90deg, #6366f1 0%, #0d9488 100%); /* @kind other */\n  --gradient-avatar: linear-gradient(135deg, var(--brand) 0%, var(--brand-hover) 100%); /* @kind other */\n  --gradient-heading: linear-gradient(135deg, var(--text-primary) 30%, var(--brand) 100%); /* @kind other */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.25, 0.8, 0.25, 1); /* @kind other */\n  --transition-fast: 0.2s ease; /* @kind other */\n  --transition-glass: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s var(--ease-out); /* @kind other */\n}\n\n[data-theme=\"light\"] {\n  --card-shadow: 0 18px 40px -14px rgba(15, 23, 42, 0.16),\n                 0 0 0 1px rgba(15, 23, 42, 0.03) inset;\n  --blob-gradient-1: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-2: radial-gradient(circle, rgba(13, 148, 136, 0.16) 0%, transparent 65%); /* @kind other */\n  --blob-gradient-3: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, transparent 65%); /* @kind other */\n}\n\n/* ==========================================================================\n   Wobblio · Base elements & core utility classes\n   Reusable primitives shared by specimen cards, UI kits and prototypes.\n   ========================================================================== */\n\n*, *::before, *::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  background-color: var(--bg-color);\n  color: var(--text-primary);\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out);\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\np { margin: 0; color: var(--text-secondary); }\n\na { color: var(--brand); text-decoration: none; }\n\n.tabular { font-variant-numeric: tabular-nums; }\n\n/* ---- Premium polish: selection, scrollbars, focus ---------------------- */\n::selection { background: var(--brand-glow); color: var(--text-primary); }\n* { scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent; }\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }\n::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: padding-box; }\n:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }\nbutton, a, input, select, [role=\"button\"] { -webkit-tap-highlight-color: transparent; }\n\n/* ---- Aurora background ------------------------------------------------- */\n.aurora-bg {\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  z-index: 0;\n  overflow: hidden;\n  background: var(--bg-color);\n  transition: background-color 0.4s var(--ease-out);\n}\n.aurora-bg .blob {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(120px);\n  opacity: 0.85;\n}\n.aurora-bg .blob-1 {\n  width: 650px; height: 650px;\n  background: var(--blob-gradient-1);\n  top: -200px; right: -100px;\n  animation: wobblioBlob 15s ease-in-out infinite alternate;\n}\n.aurora-bg .blob-2 {\n  width: 500px; height: 500px;\n  background: var(--blob-gradient-2);\n  bottom: 10%; left: -150px;\n  animation: wobblioBlob 18s ease-in-out infinite alternate-reverse;\n}\n.aurora-bg .blob-3 {\n  width: 700px; height: 400px;\n  background: var(--blob-gradient-3);\n  top: 45%; left: 45%;\n  transform: translate(-50%, -50%);\n  filter: blur(140px);\n}\n@keyframes wobblioBlob {\n  0%   { transform: translateY(0) scale(1); }\n  100% { transform: translateY(30px) scale(1.1); }\n}\n@media (prefers-reduced-motion: reduce) {\n  .aurora-bg .blob { animation: none; }\n}\n\n/* ---- Glass surface ----------------------------------------------------- */\n.glass {\n  background: var(--glass-bg);\n  border: 1px solid var(--glass-border);\n  backdrop-filter: var(--blur-glass);\n  -webkit-backdrop-filter: var(--blur-glass);\n  border-radius: var(--radius-xl);\n  box-shadow: var(--card-shadow);\n  transition: var(--transition-glass);\n}\n.glass:hover { border-color: var(--glass-hover-border); }\n.glass-interactive:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--card-shadow), var(--shadow-brand-glow);\n}\n\n/* ---- Badge / pill ------------------------------------------------------ */\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-body);\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-semibold);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  padding: 4px 10px;\n  border-radius: var(--radius-pill);\n  white-space: nowrap;\n}\n.badge--primary { background: var(--brand-glow);   color: var(--brand);   border: 1px solid rgba(99,102,241,0.2); }\n.badge--success { background: var(--success-glow); color: var(--success); border: 1px solid rgba(13,148,136,0.2); }\n.badge--warning { background: var(--warning-glow); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }\n.badge--danger  { background: var(--danger-glow);  color: var(--danger);  border: 1px solid rgba(244,63,94,0.2); }\n\n/* ---- Buttons ----------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  font-weight: var(--weight-semibold);\n  border-radius: var(--radius-lg);\n  padding: 11px 24px;\n  cursor: pointer;\n  transition: all var(--transition-fast);\n  border: 1px solid transparent;\n  outline: none;\n  text-decoration: none;\n}\n.btn--primary {\n  background: var(--brand);\n  color: #ffffff;\n  box-shadow: 0 4px 20px -2px var(--brand-glow);\n}\n.btn--primary:hover {\n  background: var(--brand-hover);\n  transform: translateY(-1px);\n  box-shadow: 0 6px 24px -1px var(--brand-glow);\n}\n.btn--outline {\n  background: transparent;\n  color: var(--text-primary);\n  border: 1px solid var(--glass-border);\n}\n.btn--outline:hover { background: var(--glass-highlight); border-color: var(--text-secondary); }\n.btn--text { background: transparent; color: var(--text-secondary); padding: 8px 16px; }\n.btn--text:hover { color: var(--text-primary); }\n.btn--lg { padding: 14px 28px; font-size: var(--text-lg); }\n.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }\n\n.btn-icon {\n  width: var(--icon-button);\n  height: var(--icon-button);\n  border-radius: 50%;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  transition: all var(--transition-fast);\n  border: 1px solid var(--glass-border);\n  background: var(--glass-bg);\n  color: var(--text-primary);\n}\n.btn-icon:hover { border-color: var(--brand); color: var(--brand); transform: scale(1.05); }\n\n<\u002Fstyle>\n<script src=\"8e685453-f1f8-4766-814d-4926338394e8\"><\u002Fscript>\n<style>\n  body{margin:0;background:#07080d;font-family:var(--font-body);-webkit-font-smoothing:antialiased}\n  .dv-turn{padding:64px 60px 56px;scroll-margin-top:16px}\n  .dv-thd{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}\n  .dv-tid{font:700 11px ui-monospace,Menlo,monospace;padding:4px 9px;background:#6366f1;color:#fff;border-radius:5px;text-decoration:none}\n  .dv-tname{font:600 15px/1.3 var(--font-display);color:#e7eaf3}\n  .dv-sub{font:400 13px/1.5 var(--font-body);color:#7c869c;margin:0 0 30px;max-width:680px}\n  .dv-opts{display:flex;flex-wrap:wrap;gap:46px;align-items:flex-start}\n  .dv-opt{flex:none;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}\n  .dv-olabel{display:flex;align-items:baseline;gap:10px;font:400 12.5px/1.4 var(--font-body);color:#8b94a8;max-width:380px}\n  .dv-oid{font:700 11px ui-monospace,Menlo,monospace;padding:3px 8px;background:rgba(255,255,255,.07);color:#c7cede;border-radius:5px;text-decoration:none}\n  .dv-opt:target .dv-oid{background:#6366
