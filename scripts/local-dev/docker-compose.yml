services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wobblio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wobblio_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wobblio_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wobblio_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wobblio_dev} -d ${POSTGRES_DB:-wobblio_local}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wobblio-local

  localstack:
    image: localstack/localstack:3.8.0
    container_name: wobblio-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,lambda,apigateway,sns,ses,ssm,secretsmanager,events,kms,cloudformation,sts,iam
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-1}
      LAMBDA_DOCKER_NETWORK: wobblio-local
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      # PERSISTENCE=1 only works with LocalStack Pro; Community always starts clean.
      # Run 'make deploy' after any restart to restore CDK resources and seeds.
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - wobblio-local

  cognito-local:
    image: jagregory/cognito-local:latest
    container_name: wobblio-cognito
    ports:
      - "9229:9229"
    environment:
      PORT: 9229
    volumes:
      - cognito-data:/app/.cognito
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');const req=h.request({hostname:'0.0.0.0',port:9229,path:'/'}, r=>process.exit(0));req.on('error',()=>process.exit(1));req.end()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - wobblio-local

  bedrock-mock:
    build:
      context: ./bedrock-mock
      dockerfile: Dockerfile
    container_name: wobblio-bedrock-mock
    ports:
      - "4577:4577"
    environment:
      PORT: 4577
      ERROR_INJECTION_RATE: ${BEDROCK_ERROR_INJECTION_RATE:-0}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4577/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - wobblio-local

networks:
  wobblio-local:
    driver: bridge
    name: wobblio-local

volumes:
  pgdata:
  localstack-data:
  cognito-data:
