<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-color); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 22px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; width: 100%; margin-bottom: 2px; font-family: var(--font-body); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Badge, Tag, Card } = window.WobblioDesignSystem_6a8d64;
const Arrow = () => <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>;
function Demo() {
  return (
    <div>
      <div className="row">
        <span className="label">Buttons</span>
        <Button variant="primary" iconRight={<Arrow/>}>Start Ingesting Free</Button>
        <Button variant="outline">Explore Use Cases</Button>
        <Button variant="text">Cancel</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div>
      <div className="row">
        <span className="label">Badges &amp; Tags</span>
        <Badge tone="success">Processed</Badge>
        <Badge tone="warning">Needs Review</Badge>
        <Badge tone="primary">Auto Parsed</Badge>
        <Badge tone="danger">Over Budget</Badge>
        <Tag>weekly</Tag>
        <Tag removable>dinner</Tag>
      </div>
      <div className="row" style={{marginBottom:0}}>
        <span className="label">Card</span>
        <Card interactive style={{flex:1, minWidth:260}}>
          <h3 style={{fontSize:16, marginBottom:6}}>Smart Recommendations</h3>
          <p style={{fontSize:13.5, lineHeight:1.5}}>Save up to <strong style={{color:'var(--success)'}}>€24.80</strong> by shopping at Jumbo Oostpoort instead of AH XL.</p>
        </Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
