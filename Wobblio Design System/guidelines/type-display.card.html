<!-- @dsCard group="Type" viewport="700x180" name="Outfit — Display" subtitle="Titles, metrics & financial totals" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:28px; background:var(--bg-color); }
  .big { font-family:var(--font-display); font-weight:800; font-size:48px; letter-spacing:-0.03em; color:var(--text-primary); line-height:1; }
  .sub { font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--text-primary); margin-top:14px; letter-spacing:-0.02em; }
  .meta { font-size:12px; color:var(--text-muted); margin-top:14px; font-family:var(--font-body); }
  .w { display:flex; gap:18px; margin-top:8px; }
  .w span { font-family:var(--font-display); font-size:18px; color:var(--text-secondary); }
</style></head>
<body>
  <div class="big">Outsmart inflation.</div>
  <div class="sub">Your Everyday Savings</div>
  <div class="w"><span style="font-weight:400">Regular</span><span style="font-weight:500">Medium</span><span style="font-weight:600">Semibold</span><span style="font-weight:700">Bold</span><span style="font-weight:800">Black</span></div>
  <div class="meta">Outfit · geometric sans · weights 400–800 · --font-display</div>
</body></html>
