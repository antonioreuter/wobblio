<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Hero → overline, with tokens" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg-color); }
  .r { display:flex; align-items:baseline; gap:16px; padding:5px 0; border-bottom:1px solid var(--glass-border); }
  .r:last-child { border-bottom:0; }
  .d { font-family:var(--font-display); font-weight:700; color:var(--text-primary); letter-spacing:-0.02em; line-height:1.1; }
  .t { margin-left:auto; font-size:11px; color:var(--text-muted); font-family:var(--font-body); white-space:nowrap; }
</style></head>
<body>
  <div class="r"><span class="d" style="font-size:42px">Section title</span><span class="t">--text-4xl · 42 / 800</span></div>
  <div class="r"><span class="d" style="font-size:32px">€642.30 metric</span><span class="t">--text-3xl · 32 / 800</span></div>
  <div class="r"><span class="d" style="font-size:24px">Pane heading</span><span class="t">--text-2xl · 24 / 700</span></div>
  <div class="r"><span class="d" style="font-size:20px">Card title</span><span class="t">--text-xl · 20 / 700</span></div>
  <div class="r"><span class="d" style="font-size:14px; font-family:var(--font-body); font-weight:500; color:var(--text-secondary)">Body copy default</span><span class="t">--text-md · 14 / 500</span></div>
  <div class="r"><span class="d" style="font-size:11px; font-family:var(--font-body); font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted)">Overline label</span><span class="t">--text-2xs · 11 / 600</span></div>
</body></html>
