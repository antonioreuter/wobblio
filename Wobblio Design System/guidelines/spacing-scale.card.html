<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base · --space-1 → --space-20" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg-color); display:flex; align-items:flex-end; gap:14px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--brand-glow); border:1px solid rgba(99,102,241,.3); border-radius:var(--radius-sm); width:28px; }
  .v { font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .t { font-size:10px; color:var(--text-secondary); font-weight:600; }
</style></head>
<body>
  <div class="col"><div class="bar" style="height:8px"></div><div class="v">8</div><div class="t">2</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="v">12</div><div class="t">3</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="v">16</div><div class="t">4</div></div>
  <div class="col"><div class="bar" style="height:20px"></div><div class="v">20</div><div class="t">5</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="v">24</div><div class="t">6</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="v">32</div><div class="t">8</div></div>
  <div class="col"><div class="bar" style="height:40px"></div><div class="v">40</div><div class="t">10</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="v">48</div><div class="t">12</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="v">64</div><div class="t">16</div></div>
  <div class="col"><div class="bar" style="height:80px"></div><div class="v">80</div><div class="t">20</div></div>
</body></html>
