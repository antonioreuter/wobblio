<!-- @dsCard group="Colors" viewport="700x150" name="Text Hierarchy" subtitle="Star white → slate → muted on deep space" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:28px; background:var(--bg-color); display:flex; flex-direction:column; gap:14px; }
  .line { display:flex; align-items:baseline; gap:16px; }
  .demo { font-family:var(--font-display); font-weight:700; font-size:22px; }
  .tok { font-size:11px; color:var(--text-muted); font-family:var(--font-body); margin-left:auto; }
</style></head>
<body>
  <div class="line"><span class="demo" style="color:var(--text-primary)">Total tracked spend €642.30</span><span class="tok">--text-primary · #F8FAFC</span></div>
  <div class="line"><span class="demo" style="color:var(--text-secondary); font-weight:500">Overview of your household expenses</span><span class="tok">--text-secondary · #94A3B8</span></div>
  <div class="line"><span class="demo" style="color:var(--text-muted); font-weight:500; font-size:18px">12 Jun 2026 · 21 items</span><span class="tok">--text-muted · #64748B</span></div>
</body></html>
