<!-- @dsCard group="Brand" viewport="700x220" name="Logo & Wordmark" subtitle="Double-loop crossover wave + lockup" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:30px; background:var(--bg-color); display:flex; align-items:center; gap:44px; }
  .lock { display:flex; align-items:center; gap:12px; }
  .wm { font-family:var(--font-display); font-size:30px; font-weight:800; letter-spacing:-0.5px; color:var(--text-primary); }
  .acc { color:var(--brand); }
  .cap { font-size:11px; color:var(--text-muted); margin-top:14px; font-family:var(--font-body); }
  .col { display:flex; flex-direction:column; align-items:flex-start; }
</style></head>
<body>
  <div class="col">
    <img src="../assets/wobblio-logo.svg" width="76" height="50" alt="Wobblio mark">
    <div class="cap">Mark only</div>
  </div>
  <div class="col">
    <div class="lock">
      <img src="../assets/wobblio-logo.svg" width="42" height="28" alt="">
      <span class="wm">wobbl<span class="acc">io</span></span>
    </div>
    <div class="cap">Lockup · indigo→teal gradient · “io” in Electric Indigo · never on a gradient box</div>
  </div>
</body></html>
