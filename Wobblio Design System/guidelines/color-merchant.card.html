<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-color); }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  .m { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .dot { width:48px; height:48px; border-radius:var(--radius-md); }
  .n { font-size:11px; color:var(--text-secondary); font-weight:600; }
  .h { font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
</style></head>
<body>
<div class="row">
  <div class="m"><div class="dot" style="background:#00a1e2"></div><div class="n">Albert Heijn</div><div class="h">#00A1E2</div></div>
  <div class="m"><div class="dot" style="background:#f59e0b"></div><div class="n">Jumbo</div><div class="h">#F59E0B</div></div>
  <div class="m"><div class="dot" style="background:#ef4444"></div><div class="n">Dirk</div><div class="h">#EF4444</div></div>
  <div class="m"><div class="dot" style="background:#8b5cf6"></div><div class="n">Lidl</div><div class="h">#8B5CF6</div></div>
  <div class="m"><div class="dot" style="background:#10b981"></div><div class="n">Tokomania</div><div class="h">#10B981</div></div>
  <div class="m"><div class="dot" style="background:#be123c"></div><div class="n">Cantinho</div><div class="h">#BE123C</div></div>
</div>
</body></html>
