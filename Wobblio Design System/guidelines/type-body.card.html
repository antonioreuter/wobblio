<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:28px; background:var(--bg-color); font-family:var(--font-body); }
  .lead { font-size:17px; color:var(--text-secondary); line-height:1.7; max-width:560px; }
  .body { font-size:14px; color:var(--text-secondary); line-height:1.6; max-width:560px; margin-top:12px; }
  .small { font-size:12px; color:var(--text-muted); margin-top:12px; }
  .w { display:flex; gap:18px; margin-top:14px; }
  .w span { font-size:15px; color:var(--text-primary); }
</style></head>
<body>
  <div class="lead">Wobblio reads any receipt with AI — automatic expense tracking, real local price comparison.</div>
  <div class="body">Drag and drop receipt photos. AI extracts merchant names, product descriptions, quantities, and prices in seconds.</div>
  <div class="w"><span style="font-weight:400">Regular</span><span style="font-weight:500">Medium</span><span style="font-weight:600">Semibold</span><span style="font-weight:700">Bold</span></div>
  <div class="small">Inter · neutral UI sans · weights 400–700 · --font-body</div>
</body></html>
