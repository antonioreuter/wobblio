<!-- @dsCard group="Type" viewport="700x160" name="Tabular Figures" subtitle="Right-aligned currency columns — tabular-nums" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 28px; background:var(--bg-color); font-family:var(--font-body); }
  table { width:100%; border-collapse:collapse; max-width:420px; }
  td { padding:7px 0; font-size:14px; color:var(--text-secondary); border-bottom:1px solid var(--glass-border); }
  .num { text-align:right; font-family:var(--font-display); font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .cap { font-size:11px; color:var(--text-muted); margin-top:12px; }
</style></head>
<body>
<table>
  <tr><td>Organic Whole Milk 1L</td><td class="num">€3.89</td></tr>
  <tr><td>Free Range Eggs (12)</td><td class="num">€14.25</td></tr>
  <tr><td>Sourdough Bread 800g</td><td class="num">€2.99</td></tr>
  <tr><td style="border:0; font-weight:600; color:var(--text-primary)">Total</td><td class="num" style="border:0; color:var(--brand); font-size:18px">€21.13</td></tr>
</table>
<div class="cap">All financial figures use Outfit + font-variant-numeric: tabular-nums so digits align vertically.</div>
</body></html>
